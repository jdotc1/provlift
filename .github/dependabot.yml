version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/examples/workflows"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/docs-site"
    schedule:
      interval: weekly
    groups:
      docs-minor-patch:
        update-types:
          - minor
          - patch
